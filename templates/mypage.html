{% extends "layouts/base.html" %}

{% block title %}My Page - PneusPage{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <div class="flex flex-col md:flex-row items-center gap-8">
                    <div class="avatar">
                        <div class="w-48 rounded-full">
                            <img src="{{ url_for('static', filename='images/profile.svg') }}" alt="Profile">
                        </div>
                    </div>
                    <div class="flex-1 space-y-4">
                        <h2 class="card-title text-2xl text-primary">User Information</h2>
                        <div class="space-y-2">
                            <div class="flex gap-2">
                                <span class="font-semibold">NAME:</span>
                                <span>{{ username }}</span>
                            </div>
                            <div class="flex gap-2">
                                <span class="font-semibold">E-Mail:</span>
                                <span>{{ email }}</span>
                            </div>
                            <div class="flex gap-2">
                                <span class="font-semibold">JOIN DATE:</span>
                                <span>{{ join_date }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
