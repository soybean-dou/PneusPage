name: Development Task
description: Issue for new features, refactoring, documentation, bug fixes
title: "[TYPE] Task title"
labels: ["development"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Development Task Issue
        Please select the appropriate task type and add the corresponding label manually:
        - `[FEATURE]` → Add label **feature**
        - `[REFACTOR]` → Add label **refactor**
        - `[DOCS]` → Add label **docs**
        - `[FIX]` → Add label **fix**
        - `[CHORE]` → Add label **chore**
        
  - type: dropdown
    id: type
    attributes:
      label: Task Type
      description: What kind of task is this?
      options:
        - "feature - New Feature"
        - "refactor - Code Refactoring"
        - "docs - Documentation"
        - "fix - Bug Fix"
        - "chore - Maintenance/Chores"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What will you develop/modify?
      placeholder: |
        Examples: 
        - Add user authentication
        - Separate service layer
        - Update README
        - Fix login error
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Detailed Description
      description: Detailed explanation of the task (optional)
      placeholder: |
        - Implementation approach
        - Considerations
        - References

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: Task checklist (optional)
      value: |
        - [ ] Task 1
        - [ ] Task 2
        - [ ] Write tests
        - [ ] Update documentation

  - type: checkboxes
    id: ready
    attributes:
      label: Ready
      options:
        - label: I have provided sufficient information for this issue
          required: true
