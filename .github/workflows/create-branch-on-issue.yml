name: Create Branch on Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Label 가져오기
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels --jq '.labels[].name' || echo "")
          
          # bug report는 브랜치 생성 안 함
          if echo "$LABELS" | grep -qi "bug report"; then
            echo "Bug report issue - 브랜치 생성을 건너뜁니다."
            echo "SKIP_BRANCH=true" >> $GITHUB_ENV
            exit 0
          fi
          
          # [기능코드] 패턴 찾기 (FEAT, REFACTOR, DOCS, FIX)
          FEATURE_CODE=""
          for label in $LABELS; do
            if [[ $label =~ ^\[([A-Z]+)\] ]]; then
              CODE="${BASH_REMATCH[1]}"
              # 허용된 코드만 처리
              if [[ "$CODE" =~ ^(FEAT|REFACTOR|DOCS|FIX)$ ]]; then
                FEATURE_CODE="$CODE"
                break
              fi
            fi
          done
          
          # Label이 없으면 브랜치 생성 안 함
          if [ -z "$FEATURE_CODE" ]; then
            echo "유효한 label이 없습니다 - 브랜치 생성을 건너뜁니다."
            echo "SKIP_BRANCH=true" >> $GITHUB_ENV
            exit 0
          fi
          
          # 브랜치명 생성: label/기능코드-이슈번호
          BRANCH_NAME=$(echo "${FEATURE_CODE}" | tr '[:upper:]' '[:lower:]')
          BRANCH_NAME="${BRANCH_NAME}/${FEATURE_CODE}-${ISSUE_NUMBER}"
          
          echo "Creating branch: $BRANCH_NAME"
          
          # 브랜치 생성 및 푸시
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "SKIP_BRANCH=false" >> $GITHUB_ENV

      - name: Comment on issue
        if: env.SKIP_BRANCH != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ 브랜치가 자동으로 생성되었습니다: \`${branchName}\`\n\n작업을 시작하려면:\n\`\`\`bash\ngit fetch origin\ngit checkout ${branchName}\n\`\`\``
            })
