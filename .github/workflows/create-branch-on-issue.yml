name: Create Branch on Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Label 가져오기
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels --jq '.labels[].name' || echo "")
          
          echo "Labels found: $LABELS"
          echo "Issue title: $ISSUE_TITLE"
          
          # bug report는 브랜치 생성 안 함
          if echo "$LABELS" | grep -qi "bug report"; then
            echo "Bug report issue - skipping branch creation."
            echo "SKIP_BRANCH=true" >> $GITHUB_ENV
            exit 0
          fi
          
          # Label 타입 결정
          LABEL_TYPE=""
          if echo "$LABELS" | grep -qi "^feature$"; then
            LABEL_TYPE="feature"
          elif echo "$LABELS" | grep -qi "^refactor$"; then
            LABEL_TYPE="refactor"
          elif echo "$LABELS" | grep -qi "^docs$"; then
            LABEL_TYPE="docs"
          elif echo "$LABELS" | grep -qi "^fix$"; then
            LABEL_TYPE="fix"
          elif echo "$LABELS" | grep -qi "^chore$"; then
            LABEL_TYPE="chore"
          fi
          
          # Label이 없으면 브랜치 생성 안 함
          if [ -z "$LABEL_TYPE" ]; then
            echo "No valid label found - skipping branch creation."
            echo "Valid labels: feature, refactor, docs, fix, chore"
            echo "SKIP_BRANCH=true" >> $GITHUB_ENV
            exit 0
          fi
          
          # 타이틀에서 [기능코드] 추출
          if [[ "$ISSUE_TITLE" =~ ^\[([^\]]+)\] ]]; then
            FEATURE_CODE="${BASH_REMATCH[1]}"
            # 소문자로 변환하고 공백/특수문자를 하이픈으로
            FEATURE_CODE=$(echo "$FEATURE_CODE" | tr '[:upper:]' '[:lower:]' | tr -cs '[:alnum:]-' '-' | sed 's/-*$//')
            echo "Extracted feature code: $FEATURE_CODE"
          else
            echo "No feature code found in title format [CODE]"
            echo "SKIP_BRANCH=true" >> $GITHUB_ENV
            exit 0
          fi
          
          # 브랜치명 생성: label/기능코드-이슈번호
          BRANCH_NAME="${LABEL_TYPE}/${FEATURE_CODE}-${ISSUE_NUMBER}"
          
          echo "Creating branch: $BRANCH_NAME"
          
          # 브랜치 생성 및 푸시
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "SKIP_BRANCH=false" >> $GITHUB_ENV

      - name: Comment on issue
        if: env.SKIP_BRANCH != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Branch created automatically: \`${branchName}\`\n\nTo start working:\n\`\`\`bash\ngit fetch origin\ngit checkout ${branchName}\n\`\`\``
            })
