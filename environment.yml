name: pneumo_page
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python=3.8

  # Flask and extensions
  - flask>=2.3.0
  - flask-sqlalchemy>=3.0.0
  - flask-bootstrap
  
  # Database
  - sqlalchemy>=2.0.0
  
  # Google OAuth and requests
  - google-auth>=2.16.0
  - google-auth-oauthlib>=1.0.0
  - oauthlib>=3.2.2
  - requests>=2.28.0
  - requests-oauthlib>=1.3.1
  
  # Data processing
  - pandas>=1.5.0
  - numpy>=1.23.0
  
  # Utilities
  - python-dotenv>=1.0.0
  - werkzeug>=2.3.0
  
  # Bioinformatics tools
  - fastqc
  - trimmomatic
  - kraken2
  - bracken
  - spades
  - quast
  - prokka
  - mlst
  - abricate
  
  # Additional pip packages (not available in conda)
  - pip
  - pip:
    - jsonpickle>=3.0.0
    - Flask-Bootstrap>=3.3.7.1
    - vendor>=0.1.0
